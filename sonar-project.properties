sonar.projectKey=aorfevre_cmux-companion
sonar.projectName=cmux-companion
sonar.sourceEncoding=UTF-8
# Organization is supplied by CI from the verified account key.
sonar.sources=app,server,worker,updater/src,scripts
sonar.tests=tests,cypress,updater/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.wrangler/**,**/coverage/**,cypress/screenshots/**,cypress/videos/**,cypress/results/**
sonar.javascript.lcov.reportPaths=coverage/backend.lcov,coverage/ui/lcov.info
sonar.javascript.file.suffixes=.js,.jsx,.mjs,.cjs
sonar.typescript.file.suffixes=.ts,.tsx
