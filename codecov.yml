coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: 90%
        informational: true
# Local backend/UI tests remain the authoritative 90% line-coverage gates.
# Start Codecov statuses as informational while establishing the main baseline.
comment:
  layout: 'diff, files'
  behavior: default
  require_changes: true
  require_base: true
  require_head: true
