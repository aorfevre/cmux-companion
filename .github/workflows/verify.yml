name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Match the installed updater environment; UI scripts must select test mode.
      - run: npm run verify
        env:
          NODE_ENV: production
      # Cypress is intentionally local-only; see AGENTS.md.
