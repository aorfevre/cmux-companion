name: Review and auto-merge
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: write
concurrency:
  group: review-auto-merge
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always trusted default-branch code; never fetch PR code or artifacts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Create repository-scoped merge token
        id: merge-token
        if: vars.AUTO_MERGE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0, Node 24
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
          permission-actions: read
          permission-checks: read
          permission-statuses: read
      - name: Request reviews and queue protected merges
        run: node scripts/review-auto-merge.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE_TOKEN: ${{ steps.merge-token.outputs.token }}
